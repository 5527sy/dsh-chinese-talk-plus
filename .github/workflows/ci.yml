name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile bridge/record_sink.py bridge/__init__.py
      - run: python -m pip wheel . --no-deps --wheel-dir dist-python
