[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dsh-chinese-talk-plus-bridge"
version = "0.3.0"
description = "Local speech bridge for the dsh-chinese-talk-plus DeepSeek Harness plugin"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "dsh-chinese-talk-plus contributors" }]
dependencies = [
  "edge-tts",
  "fastapi",
  "funasr",
  "modelscope",
  "numpy",
  "qwen-tts",
  "soundfile",
  "uvicorn",
]

[project.scripts]
dsh-chinese-talk-plus-bridge = "bridge.record_sink:main"

[project.urls]
Homepage = "https://github.com/5527sy/dsh-chinese-talk-plus"
Issues = "https://github.com/5527sy/dsh-chinese-talk-plus/issues"

[tool.setuptools]
packages = ["bridge"]

[tool.setuptools.package-data]
bridge = ["*.ps1", "*.cmd", "*.sh", "requirements.txt"]
